services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - --models-preset
      - "/config.ini"
      - --port
      - "8080"
      - --host
      - 0.0.0.0
    volumes:
      - "/home/tom/llm/:/llm/:ro"
      - "./config.ini:/config.ini:ro"
    ports:
      - "8080:8080"
    networks:
      - llm_network
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
              - gpu

networks:
  llm_network:
    external: true
